name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci --silent
      - name: Build backend
        working-directory: backend
        run: |
          npm run build
      - name: Audit backend
        working-directory: backend
        run: |
          npm audit --audit-level=moderate || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install web deps
        working-directory: web
        run: |
          npm ci --silent || npm install --silent
      - name: Build web
        working-directory: web
        run: |
          npm run build
      - name: Audit web
        working-directory: web
        run: |
          npm audit --audit-level=moderate || true
